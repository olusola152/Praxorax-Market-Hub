  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132A21"/>
      <stop offset="1" stop-color="#0C1714"/>
    </linearGradient>
    <radialGradient id="a-pool" cx=".5" cy=".5" r=".46">
