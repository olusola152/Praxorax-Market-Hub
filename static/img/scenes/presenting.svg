<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"
     width="1600" height="1000" role="img">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132A21"/>
      <stop offset="1" stop-color="#0C1714"/>
    </linearGradient>
    <radialGradient id="glow" cx=".62" cy=".38" r=".52">
      <stop offset="0" stop-color="#4FD6A0" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#2C6349" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0C1714" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7F1"/>
      <stop offset="1" stop-color="#C9D6C8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD6A0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4FD6A0" stop-opacity="0"/>
    </linearGradient>
  <filter id="g1" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="1"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  </defs>
  
